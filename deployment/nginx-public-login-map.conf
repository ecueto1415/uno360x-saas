# http context: rewrite marketing links only for the public SaaS website.
# The ERP host retains its existing native login link and database behavior.
map $host $uno360x_public_login {
    default /web/login;
    uno360x.com https://cuenta.uno360x.com/web/login;
    www.uno360x.com https://cuenta.uno360x.com/web/login;
}

map $host $uno360x_public_nav_inject {
    default "";
    uno360x.com '<script defer src="/uno360x-saas-nav.js"></script>';
    www.uno360x.com '<script defer src="/uno360x-saas-nav.js"></script>';
}
