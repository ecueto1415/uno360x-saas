# Stage only. Enable after certificates and DNS match both dedicated hosts.
limit_req_zone $binary_remote_addr zone=uno360x_pilot:1m rate=3r/s;
server {
 listen 80;
 server_name cuenta.uno360x.com piloto.uno360x.com;
 location ^~ /.well-known/acme-challenge/ { root /var/lib/uno360x-acme; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 server_name cuenta.uno360x.com;
 ssl_certificate /etc/letsencrypt/live/uno360x-saas-pilot/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/uno360x-saas-pilot/privkey.pem;
 client_max_body_size 16k;
 access_log off;
 location / {
  limit_req zone=uno360x_pilot burst=12 nodelay;
  proxy_pass http://127.0.0.1:18183;
  proxy_set_header Host cuenta.uno360x.com;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Forwarded-Proto "";
  proxy_read_timeout 150s;
 }
}
server {
 listen 443 ssl;
 server_name piloto.uno360x.com;
 ssl_certificate /etc/letsencrypt/live/uno360x-saas-pilot/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/uno360x-saas-pilot/privkey.pem;
 client_max_body_size 16m;
 access_log off;
 location / {
  proxy_pass http://127.0.0.1:18184;
  proxy_set_header Host piloto.uno360x.com;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Forwarded-Host "";
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_read_timeout 150s;
  proxy_buffering off;
 }
}
