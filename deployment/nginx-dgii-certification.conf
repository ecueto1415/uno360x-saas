# Included only in the existing native HTTP/HTTPS virtualhosts.
# Case-insensitive paths are required by DGII. No native Odoo routes change.
location ~* ^/certificacion/fe/(recepcion|aprobacioncomercial)/api/ecf/?$ {
    if ($host != erp.uno360x.com) { return 404; }
    client_max_body_size 5m;
    client_body_timeout 15s;
    proxy_pass http://127.0.0.1:18186;
    proxy_set_header Host erp.uno360x.com;
    proxy_set_header X-Forwarded-Host "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    access_log off;
    add_header Cache-Control "no-store" always;
}
