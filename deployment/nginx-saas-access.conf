location = /prueba-saas { add_header Cache-Control "no-store" always; return 302 https://cuenta.uno360x.com/prueba/inicio; }
# Only the separate SaaS status service; never forwards credentials to Odoo.
location ^~ /.well-known/acme-challenge/ {
    root /var/lib/uno360x-acme;
    default_type text/plain;
    try_files $uri =404;
}
location = /saas { return 302 https://cuenta.uno360x.com/prueba/inicio; }
location = /saas/ { add_header Cache-Control "no-store" always; return 302 https://cuenta.uno360x.com/prueba/inicio; }
location ^~ /saas/ {
    proxy_pass http://127.0.0.1:18082/;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 15s;
    client_max_body_size 16k;
    add_header Cache-Control "no-store" always;
}
