# Exact access page only. Database manager, backup and listing remain blocked.
location = /web/database/selector {
 alias /var/www/uno360x-operational-access.html;
 default_type text/html;
 add_header Cache-Control "no-store" always;
 add_header X-Content-Type-Options "nosniff" always;
}

# One-use native login exchange. No database administration is exposed.
location = /__operational/enter {
 if ($host != erp.uno360x.com) { return 404; }
 limit_except POST { deny all; }
 client_max_body_size 512;
 access_log off;
 proxy_pass http://127.0.0.1:18183;
 proxy_set_header Host erp.uno360x.com;
 proxy_set_header X-Forwarded-Host "";
 proxy_set_header X-Forwarded-For "";
 proxy_set_header X-UNO360X-Client-IP $uno360x_login_client_ip;
 proxy_read_timeout 15s;
}

# End the native session first, then return to the shared login.
location = /web/session/logout {
 proxy_pass http://127.0.0.1:8069/web/session/logout?redirect=/uno360x-unified-return;
 proxy_redirect /uno360x-unified-return https://cuenta.uno360x.com/web/login;
 add_header Cache-Control "no-store" always;
}
