limit_req_zone $binary_remote_addr zone=uno360x_owner:1m rate=3r/s;
server {
 listen 80;
 server_name admin.uno360x.com;
 location ^~ /.well-known/acme-challenge/ { root /var/lib/uno360x-acme; }
 location / { return 301 https://admin.uno360x.com$request_uri; }
}
server {
 listen 443 ssl;
 server_name admin.uno360x.com;
 ssl_certificate /etc/letsencrypt/live/uno360x-admin/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/uno360x-admin/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 8k;
 access_log off;
 add_header Strict-Transport-Security "max-age=15552000" always;
 location / {
  limit_req zone=uno360x_owner burst=20 nodelay;
  proxy_pass http://127.0.0.1:18185;
  proxy_set_header Host admin.uno360x.com;
  proxy_set_header X-UNO360X-Client-IP $uno360x_login_client_ip;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Forwarded-Proto "https";
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
 }
}
