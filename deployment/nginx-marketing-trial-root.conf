# Included in the original website server only, alongside SaaS access routes.
# Updates the obsolete trial sentence without writing to the operational Odoo DB.
location = / {
    proxy_pass http://127.0.0.1:8069;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter 'Vista previa del recorrido. Usa datos ficticios; todavía no crea una cuenta real.' 'Crea tu cuenta, confirma tu correo y prueba Base Empresarial con CRM y POS durante 15 días, sin tarjeta.';
    add_header Cache-Control "no-store" always;
}
