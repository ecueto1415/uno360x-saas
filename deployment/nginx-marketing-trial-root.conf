# Included in the original website server only, alongside SaaS access routes.
# Updates the obsolete trial sentence without writing to the operational Odoo DB.
location = / {
    proxy_pass http://127.0.0.1:8069;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter '</body>' '$uno360x_public_nav_inject</body>';
    sub_filter 'href="/web/login"' 'href="$uno360x_public_login"';
    sub_filter 'Vista previa del recorrido. Usa datos ficticios; todavía no crea una cuenta real.' 'Crea tu cuenta, confirma tu correo y prueba Base Empresarial con CRM y POS durante 15 días, sin tarjeta.';
    add_header Cache-Control "no-store" always;
}

location = /planes-y-precios {
    proxy_pass http://127.0.0.1:8069;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter 'Vista previa del recorrido con datos ficticios. Todavía no crea una cuenta real.' 'Prueba gratis real de 15 días. Confirma tu correo y prepara un espacio independiente para tu empresa.';
    sub_filter 'Empleados, asistencia y novedades.' 'Empleados, asistencia y ausencias.';
    sub_filter 'Nómina, aprobaciones y comprobantes.' 'Cálculo legal de nómina pendiente de validación.';
    sub_filter 'Consultas y asistencia con permisos.' 'Consultas internas con permisos.';
    sub_filter 'Automatizaciones y consumo acordados.' 'Conexión a IA externa en preparación.';
    sub_filter 'Presupuestos y rentabilidad.' 'Opciones avanzadas de rentabilidad en preparación.';

    sub_filter 'data-module="Nómina y RR. HH." checked="checked"' 'data-module="Nómina y RR. HH."';
    sub_filter 'data-module="Jenifer IA" checked="checked"' 'data-module="Jenifer IA"';
    sub_filter '</body>' '$uno360x_public_nav_inject</body>';
    sub_filter 'href="/web/login"' 'href="$uno360x_public_login"';
    add_header Cache-Control "no-store" always;
}

location = /uno360x-saas-nav.js {
    alias /var/www/uno360x-saas-nav.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
