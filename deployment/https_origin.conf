server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/uno360x-saas-origin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uno360x-saas-origin/privkey.pem;
    server_name uno360x.com erp.uno360x.com;
    client_max_body_size 0;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # Database management is available only through server administration.
    location ^~ /web/database { return 404; }

    include /etc/nginx/snippets/uno360x-saas-access.conf;

    location / {
        proxy_pass http://127.0.0.1:8069;
    }

    include /etc/nginx/snippets/odoo-websocket.conf;

    location /longpolling {
        proxy_pass http://127.0.0.1:8072;
    }

    location /mail/ {
        proxy_pass http://127.0.0.1:8069/mail/;
    }

    location /my/ {
        proxy_pass http://127.0.0.1:8069/my/;
    }

    location /web/ {
        proxy_pass http://127.0.0.1:8069/web/;
    }
}
